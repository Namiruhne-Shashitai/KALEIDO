name: KALEIDO Master Build

on:
  push:
    branches: ["kaleido-app-development-dd72e"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaleido-master
  cancel-in-progress: true

jobs:
  web:
    name: Web / PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Sync generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "chore: sync package lock [skip ci]"
            git push
          fi

      - name: Package web app
        run: cd dist && zip -r ../kaleido-web.zip .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaleido-web
          path: kaleido-web.zip
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaleido-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-14
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          rm -rf Payload kaleido.ipa
          mkdir Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r kaleido.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kaleido-ios-ipa-unsigned
          path: kaleido.ipa
          retention-days: 30
